name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck & build shared
        run: npm run build --workspace shared

      - name: Typecheck backend
        run: npm run typecheck --workspace backend

      - name: Typecheck & build frontend
        run: npm run build --workspace frontend

      - name: Guard against leaked service keys
        run: |
          if grep -rniE "service_role|SUPABASE_SERVICE_ROLE_KEY" frontend/src frontend/dist 2>/dev/null | grep -v "VITE_" ; then
            echo "Service role reference found in frontend code"
            exit 1
          fi

      - name: Guard against committed secrets
        run: |
          # Real JWTs or Supabase secret keys must never be committed.
          if git grep -nE 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9|sb_secret_[A-Za-z0-9_-]{8,}' -- \
            . ':(exclude)docs' ':(exclude).github/workflows/ci.yml' ':(exclude)*.example' ; then
            echo "Potential secret found in tracked files"
            exit 1
          fi
